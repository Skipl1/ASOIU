# Режим HTTPS (ENABLE_HTTPS=true, ТЗ 7.3): HTTP перенаправляется на HTTPS

upstream grsn_api {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host:__HTTPS_PUBLIC_PORT__$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/grsn/app.inc;
}
