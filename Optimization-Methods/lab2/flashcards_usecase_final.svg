<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="white"/>
  
  <!-- System Boundary -->
  <rect x="400" y="30" width="970" height="840" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="410" y="55" font-family="Arial" font-size="20" font-weight="bold">Система Карточки</text>
  
  <!-- Actor: Ученик -->
  <circle cx="120" cy="210" r="15" fill="#333333"/>
  <line x1="120" y1="225" x2="120" y2="285" stroke="#333333" stroke-width="3"/>
  <line x1="120" y1="240" x2="90" y2="270" stroke="#333333" stroke-width="3"/>
  <line x1="120" y1="240" x2="150" y2="270" stroke="#333333" stroke-width="3"/>
  <line x1="120" y1="285" x2="90" y2="340" stroke="#333333" stroke-width="3"/>
  <line x1="120" y1="285" x2="150" y2="340" stroke="#333333" stroke-width="3"/>
  <text x="120" y="365" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Ученик</text>
  
  <!-- Actor: Преподаватель -->
  <circle cx="120" cy="610" r="15" fill="#333333"/>
  <line x1="120" y1="625" x2="120" y2="685" stroke="#333333" stroke-width="3"/>
  <line x1="120" y1="640" x2="90" y2="670" stroke="#333333" stroke-width="3"/>
  <line x1="120" y1="640" x2="150" y2="670" stroke="#333333" stroke-width="3"/>
  <line x1="120" y1="685" x2="90" y2="740" stroke="#333333" stroke-width="3"/>
  <line x1="120" y1="685" x2="150" y2="740" stroke="#333333" stroke-width="3"/>
  <text x="120" y="765" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Преподаватель</text>
  
  <!-- Use Case 1 -->
  <ellipse cx="650" cy="150" rx="130" ry="45" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="650" y="145" font-family="Arial" font-size="14" text-anchor="middle">Добавить слова</text>
  <text x="650" y="165" font-family="Arial" font-size="14" text-anchor="middle">в карточки</text>
  
  <!-- Use Case 2 -->
  <ellipse cx="950" cy="150" rx="130" ry="45" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="950" y="145" font-family="Arial" font-size="14" text-anchor="middle">Открыть карточки</text>
  <text x="950" y="165" font-family="Arial" font-size="14" text-anchor="middle">для изучения</text>
  
  <!-- Use Case 3 -->
  <ellipse cx="1200" cy="260" rx="85" ry="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="1200" y="255" font-family="Arial" font-size="13" text-anchor="middle">Просмотреть</text>
  <text x="1200" y="275" font-family="Arial" font-size="13" text-anchor="middle">перевод</text>
  
  <!-- Use Case 4 -->
  <ellipse cx="950" cy="370" rx="120" ry="45" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="950" y="365" font-family="Arial" font-size="13" text-anchor="middle">Отметить как</text>
  <text x="950" y="385" font-family="Arial" font-size="13" text-anchor="middle">выученную / не выученную</text>
  
  <!-- Use Case 5 -->
  <ellipse cx="650" cy="370" rx="130" ry="45" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="650" y="365" font-family="Arial" font-size="14" text-anchor="middle">Переключить режим</text>
  <text x="650" y="385" font-family="Arial" font-size="14" text-anchor="middle">перевода</text>
  
  <!-- Use Case 6 -->
  <ellipse cx="1200" cy="490" rx="95" ry="45" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="1200" y="485" font-family="Arial" font-size="13" text-anchor="middle">Просмотреть</text>
  <text x="1200" y="505" font-family="Arial" font-size="13" text-anchor="middle">статистику</text>
  
  <!-- Use Case 7 -->
  <ellipse cx="950" cy="610" rx="130" ry="45" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="950" y="605" font-family="Arial" font-size="14" text-anchor="middle">Удалить выученные</text>
  <text x="950" y="625" font-family="Arial" font-size="14" text-anchor="middle">карточки</text>
  
  <!-- Use Case 8 -->
  <ellipse cx="650" cy="610" rx="130" ry="45" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="650" y="605" font-family="Arial" font-size="14" text-anchor="middle">Выбрать несколько</text>
  <text x="650" y="625" font-family="Arial" font-size="14" text-anchor="middle">слов</text>
  
  <!-- Connections from Ученик -->
  <line x1="135" y1="210" x2="520" y2="150" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="135" y1="210" x2="820" y2="150" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="135" y1="210" x2="520" y2="370" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="135" y1="210" x2="520" y2="610" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Connections from Преподаватель -->
  <line x1="135" y1="610" x2="520" y2="610" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="135" y1="610" x2="820" y2="610" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Include/Extend relationships -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666666"/>
    </marker>
  </defs>
  
  <!-- UC2 include UC3 -->
  <line x1="1015" y1="185" x2="1140" y2="235" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)"/>
  <text x="1080" y="205" font-family="Arial" font-size="12" fill="#666666">include</text>
  
  <!-- UC2 include UC4 -->
  <line x1="1015" y1="195" x2="1050" y2="325" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)"/>
  <text x="1040" y="270" font-family="Arial" font-size="12" fill="#666666">include</text>
  
  <!-- UC3 extend UC5 -->
  <path d="M 1160 290 Q 1000 350 780 380" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)" fill="none"/>
  <text x="950" y="320" font-family="Arial" font-size="12" fill="#666666">extend</text>
  
  <!-- UC4 extend UC6 -->
  <line x1="1065" y1="395" x2="1140" y2="465" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)"/>
  <text x="1110" y="425" font-family="Arial" font-size="12" fill="#666666">extend</text>
  
  <!-- UC7 extend UC6 -->
  <line x1="1015" y1="585" x2="1120" y2="520" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)"/>
  <text x="1070" y="545" font-family="Arial" font-size="12" fill="#666666">extend</text>
  
  <!-- UC8 extend UC1 -->
  <line x1="715" y1="575" x2="685" y2="240" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)"/>
  <text x="730" y="450" font-family="Arial" font-size="12" fill="#666666">extend</text>
  
  <!-- Legend -->
  <rect x="20" y="20" width="220" height="100" fill="#f5f5f5" stroke="#999999" stroke-width="1"/>
  <text x="30" y="45" font-family="Arial" font-size="14" font-weight="bold">Условные обозначения:</text>
  <ellipse cx="50" cy="65" rx="15" ry="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="75" y="70" font-family="Arial" font-size="11">Основной вариант</text>
  <ellipse cx="50" cy="85" rx="15" ry="8" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="75" y="90" font-family="Arial" font-size="11">Включаемый (include)</text>
  <ellipse cx="130" cy="85" rx="15" ry="8" fill="#ffebee" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="155" y="90" font-family="Arial" font-size="11">Расширяющий (extend)</text>
  
  <!-- Title -->
  <text x="700" y="880" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Диаграмма вариантов использования функции Карточки</text>
</svg>
