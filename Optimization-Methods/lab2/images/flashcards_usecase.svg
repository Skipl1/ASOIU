<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="white"/>
  
  <!-- System Boundary -->
  <rect x="350" y="20" width="830" height="760" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="360" y="45" font-family="Arial" font-size="18" font-weight="bold">Система "Карточки"</text>
  
  <!-- Actors -->
  <!-- Ученик -->
  <circle cx="100" cy="200" r="20" fill="#333"/>
  <line x1="100" y1="220" x2="100" y2="300" stroke="#333" stroke-width="3"/>
  <line x1="100" y1="240" x2="50" y2="280" stroke="#333" stroke-width="3"/>
  <line x1="100" y1="240" x2="150" y2="280" stroke="#333" stroke-width="3"/>
  <line x1="100" y1="300" x2="60" y2="380" stroke="#333" stroke-width="3"/>
  <line x1="100" y1="300" x2="140" y2="380" stroke="#333" stroke-width="3"/>
  <text x="70" y="410" font-family="Arial" font-size="16" text-anchor="middle">Ученик</text>
  
  <!-- Преподаватель -->
  <circle cx="100" cy="550" r="20" fill="#333"/>
  <line x1="100" y1="570" x2="100" y2="650" stroke="#333" stroke-width="3"/>
  <line x1="100" y1="590" x2="50" y2="630" stroke="#333" stroke-width="3"/>
  <line x1="100" y1="590" x2="150" y2="630" stroke="#333" stroke-width="3"/>
  <line x1="100" y1="650" x2="60" y2="730" stroke="#333" stroke-width="3"/>
  <line x1="100" y1="650" x2="140" y2="730" stroke="#333" stroke-width="3"/>
  <text x="85" y="760" font-family="Arial" font-size="16" text-anchor="middle">Преподаватель</text>
  
  <!-- Use Cases -->
  <!-- UC1: Добавить слова в карточки -->
  <ellipse cx="600" cy="120" rx="110" ry="40" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
  <text x="600" y="115" font-family="Arial" font-size="13" text-anchor="middle">Добавить слова</text>
  <text x="600" y="135" font-family="Arial" font-size="13" text-anchor="middle">в карточки</text>
  
  <!-- UC2: Открыть карточки для изучения -->
  <ellipse cx="900" cy="120" rx="110" ry="40" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
  <text x="900" y="115" font-family="Arial" font-size="13" text-anchor="middle">Открыть карточки</text>
  <text x="900" y="135" font-family="Arial" font-size="13" text-anchor="middle">для изучения</text>
  
  <!-- UC3: Просмотреть перевод -->
  <ellipse cx="1100" cy="220" rx="70" ry="35" fill="#fff3e0" stroke="#333" stroke-width="2"/>
  <text x="1100" y="215" font-family="Arial" font-size="12" text-anchor="middle">Просмотреть</text>
  <text x="1100" y="230" font-family="Arial" font-size="12" text-anchor="middle">перевод</text>
  
  <!-- UC4: Отметить как выученную -->
  <ellipse cx="900" cy="320" rx="100" ry="40" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
  <text x="900" y="315" font-family="Arial" font-size="12" text-anchor="middle">Отметить как</text>
  <text x="900" y="330" font-family="Arial" font-size="12" text-anchor="middle">выученную/нет</text>
  
  <!-- UC5: Переключить режим перевода -->
  <ellipse cx="600" cy="320" rx="110" ry="40" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
  <text x="600" y="315" font-family="Arial" font-size="12" text-anchor="middle">Переключить режим</text>
  <text x="600" y="330" font-family="Arial" font-size="12" text-anchor="middle">перевода</text>
  
  <!-- UC6: Просмотреть статистику -->
  <ellipse cx="1100" cy="420" rx="80" ry="40" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
  <text x="1100" y="415" font-family="Arial" font-size="12" text-anchor="middle">Просмотреть</text>
  <text x="1100" y="430" font-family="Arial" font-size="12" text-anchor="middle">статистику</text>
  
  <!-- UC7: Удалить выученные карточки -->
  <ellipse cx="900" cy="520" rx="110" ry="40" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
  <text x="900" y="515" font-family="Arial" font-size="12" text-anchor="middle">Удалить выученные</text>
  <text x="900" y="530" font-family="Arial" font-size="12" text-anchor="middle">карточки</text>
  
  <!-- UC8: Выбрать несколько слов -->
  <ellipse cx="600" cy="520" rx="110" ry="40" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
  <text x="600" y="515" font-family="Arial" font-size="12" text-anchor="middle">Выбрать несколько</text>
  <text x="600" y="530" font-family="Arial" font-size="12" text-anchor="middle">слов</text>
  
  <!-- UC9: Настроить параметры карточек -->
  <ellipse cx="600" cy="680" rx="110" ry="40" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
  <text x="600" y="675" font-family="Arial" font-size="12" text-anchor="middle">Настроить параметры</text>
  <text x="600" y="690" font-family="Arial" font-size="12" text-anchor="middle">карточек</text>
  
  <!-- UC10: Пройти тест по карточкам -->
  <ellipse cx="900" cy="680" rx="100" ry="40" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
  <text x="900" y="675" font-family="Arial" font-size="12" text-anchor="middle">Пройти тест по</text>
  <text x="900" y="690" font-family="Arial" font-size="12" text-anchor="middle">карточкам</text>
  
  <!-- Connections from actors to use cases -->
  <!-- Ученик connections -->
  <line x1="120" y1="200" x2="490" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="200" x2="790" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="200" x2="490" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="200" x2="490" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="200" x2="790" y2="680" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Преподаватель connections -->
  <line x1="120" y1="550" x2="490" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="550" x2="790" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="550" x2="490" y2="680" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="550" x2="790" y2="680" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Include/Extend relationships -->
  <!-- Открыть карточки -->
  <include>Просмотреть перевод</include>
  <line x1="955" y1="145" x2="1055" y2="195" stroke="#333" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="1010" y="165" font-family="Arial" font-size="11" fill="#666">«include»</text>
  
  <!-- Просмотреть перевод -->
  <line x1="1065" y1="245" x2="985" y2="295" stroke="#333" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="1020" y="265" font-family="Arial" font-size="11" fill="#666">«extend»</text>
  
  <!-- Отметить как выученную -->
  <line x1="955" y1="345" x2="1055" y2="395" stroke="#333" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="1010" y="365" font-family="Arial" font-size="11" fill="#666">«extend»</text>
  
  <!-- Удалить выученные -->
  <line x1="955" y1="545" x2="1035" y2="445" stroke="#333" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="1000" y="490" font-family="Arial" font-size="11" fill="#666">«extend»</text>
  
  <!-- Выбрать несколько слов -->
  <line x1="655" y1="545" x2="745" y2="545" stroke="#333" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="700" y="540" font-family="Arial" font-size="11" fill="#666">«extend»</text>
  
  <!-- Настроить параметры -->
  <line x1="655" y1="655" x2="745" y2="145" stroke="#333" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="680" y="400" font-family="Arial" font-size="11" fill="#666">«extend»</text>
</svg>
