<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>АС ГРСН - вход</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-page compact">
    <section class="auth-panel">
      <div class="brand">
        <div class="brand-mark">АС</div>
        <div>
          <strong>АС ГРСН</strong>
          <span>Спортивное питание</span>
        </div>
      </div>

      <h1>Вход в систему</h1>
      <p>Введите данные учётной записи, чтобы перейти в личный кабинет.</p>

      <form class="form">
        <div class="field">
          <label for="email">Электронная почта</label>
          <input id="email" type="email" placeholder="e-mail пользователя">
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" type="password" placeholder="пароль">
        </div>
        <label class="checkbox-row">
          <input type="checkbox">
          <span>Запомнить устройство</span>
        </label>
        <a class="btn primary" href="profile.html">Войти</a>
      </form>

      <div class="message-box" style="margin-top:18px">
        <strong>Нет учётной записи?</strong><br>
        Зарегистрируйтесь, чтобы создать профиль и настроить питание под свою цель.
        <div style="margin-top:12px">
          <a class="btn" href="register.html">Зарегистрироваться</a>
        </div>
      </div>
    </section>

  </main>
</body>
</html>
